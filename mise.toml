#:schema https://mise.jdx.dev/schema/mise.json
min_version = "2026.9.15"

[settings]
lockfile = true
lockfile_platforms = ["windows-x64"]

[tools]
rust = { version = "stable", components = ["clippy", "rustfmt"], profile = "minimal", mr_boxington = true }
mr-boxington = "latest"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[tasks.doctor]
description = "Check the Rust and Mr Boxington toolchain"
run = "mbx doctor"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.fmt-fix]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.check]
description = "Type-check all workspace targets through Mr Boxington"
run = "mbx check --locked --workspace --all-targets"

[tasks.build]
description = "Build all workspace targets through Mr Boxington"
run = "mbx build --locked --workspace --all-targets"

[tasks.bindings]
description = "Acquire pinned Windows App SDK metadata and regenerate supplemental bindings"
run = "cargo run --locked -p winio-winui-bindings-tool --"

[tasks.bindings-check]
description = "Regenerate supplemental bindings and compare with committed source"
run = "cargo run --locked -p winio-winui-bindings-tool -- --check"

[tasks.bindings-test]
description = "Run the bounded binding inventory parser unit tests"
run = "cargo test --locked -p winio-winui-bindings-tool"

[tasks.dependency-audit]
description = "Show duplicate dependency versions for the workspace"
run = "cargo tree -d"

[tasks.smoke]
description = "Run the Windows UI Automation gallery smoke test"
depends = ["build"]
run = "pwsh -NoProfile -ExecutionPolicy Bypass -File tools/smoke-gallery.ps1"

[tasks.clippy]
description = "Run Clippy with warnings denied through Mr Boxington"
run = "mbx clippy --locked --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run all workspace tests through Mr Boxington"
run = "mbx test --locked --workspace --all-targets"

[tasks.ci]
description = "Run repository validation gates"
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test" },
]
